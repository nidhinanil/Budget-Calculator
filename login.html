<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Smart Wallet</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYjJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
        integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
</head>

<body class="bg-light text-dark font-monospace d-flex align-items-center min-vh-100 py-5">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-8 col-lg-5">

                <div class="text-center mb-4">
                    <div class="d-inline-flex align-items-baseline gap-2 mb-1">
                        <span class="fs-2 fw-bold">Smart Wallet</span>
                    </div>
                    <p class="text-secondary small mb-0">Calculate Budget</p>
                </div>

                <div class="card bg-white border p-4 rounded-1 shadow-sm">

                    <!-- Tabs -->
                    <ul class="nav nav-pills nav-fill mb-4 p-1 bg-light rounded">

                        <li class="nav-item">
                            <button id="login-tab" class="nav-link active text-dark fw-bold btn-sm py-2"
                                onclick="showLogin()">
                                <i class="fa-solid fa-arrow-right-to-bracket me-1"></i>
                                Login
                            </button>
                        </li>

                        <li class="nav-item">
                            <button id="register-tab" class="nav-link text-secondary fw-bold btn-sm py-2"
                                onclick="showRegister()">
                                <i class="fa-solid fa-user-plus me-1"></i>
                                Register
                            </button>
                        </li>

                    </ul>

                    <!-- Login -->
                    <div id="login-panel">

                        <form onsubmit="handleLogin(event)">

                            <div class="mb-3">
                                <label class="small text-secondary mb-1">Username</label>

                                <div class="input-group">
                                    <span class="input-group-text bg-light text-secondary">
                                        <i class="fa-solid fa-user"></i>
                                    </span>

                                    <input id="login-user" type="text" class="form-control font-monospace"
                                        placeholder="Enter username" required>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="small text-secondary mb-1">Password</label>

                                <div class="input-group">
                                    <span class="input-group-text bg-light text-secondary">
                                        <i class="fa-solid fa-lock"></i>
                                    </span>

                                    <input id="login-pass" type="password" class="form-control font-monospace"
                                        placeholder="Enter password" required>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-dark w-100 py-2">
                                Sign In
                            </button>

                        </form>
                    </div>

                    <!-- Register -->
                    <div id="register-panel" style="display:none;">

                        <form id="reg-form" onsubmit="handleRegister(event)">

                            <div class="mb-3">
                                <label class="small text-secondary mb-1">Username</label>

                                <div class="input-group">
                                    <span class="input-group-text bg-light text-secondary">
                                        <i class="fa-solid fa-user"></i>
                                    </span>

                                    <input id="reg-user" type="text" class="form-control font-monospace"
                                        placeholder="Choose a username" required>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="small text-secondary mb-1">Email</label>

                                <div class="input-group">
                                    <span class="input-group-text bg-light text-secondary">
                                        <i class="fa-solid fa-envelope"></i>
                                    </span>

                                    <input id="reg-email" type="email" class="form-control font-monospace"
                                        placeholder="name@domain.com" required>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="small text-secondary mb-1">Password</label>

                                <div class="input-group">
                                    <span class="input-group-text bg-light text-secondary">
                                        <i class="fa-solid fa-lock"></i>
                                    </span>

                                    <input id="reg-pass" type="password" class="form-control font-monospace"
                                        placeholder="Create password" required>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-outline-dark w-100 py-2">
                                Create Account
                            </button>

                        </form>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <script>

        function showLogin() {
            document.getElementById("login-panel").style.display = "block";
            document.getElementById("register-panel").style.display = "none";

            document.getElementById("login-tab").classList.add("active");
            document.getElementById("register-tab").classList.remove("active");
        }


        function showRegister() {
            document.getElementById("login-panel").style.display = "none";
            document.getElementById("register-panel").style.display = "block";

            document.getElementById("register-tab").classList.add("active");
            document.getElementById("login-tab").classList.remove("active");
        }


        function handleLogin(event) {

            event.preventDefault();

            let username = document.getElementById("login-user").value.trim();
            let password = document.getElementById("login-pass").value;

            let user = localStorage.getItem(username);

            if (!user) {
                alert("User does not exist. Please register.");
                return;
            }

            user = JSON.parse(user);

            if (user.password != password) {
                alert("Incorrect password.");
                return;
            }

            localStorage.setItem("loggedkey", username);

            window.location.href = "index.html";
        }


        function handleRegister(event) {

            event.preventDefault();

            let username = document.getElementById("reg-user").value.trim();
            let email = document.getElementById("reg-email").value.trim();
            let password = document.getElementById("reg-pass").value;

            if (localStorage.getItem(username)) {
                alert("Username is already taken.");
                return;
            }

            let user = {
                uname: username,
                email: email,
                password: password,
                income: 0,
                expense: 0,
                incomeArray: [],
                expenseArray: []
            };

            localStorage.setItem(username, JSON.stringify(user));

            alert("Account created successfully!");

            document.getElementById("reg-form").reset();

            showLogin();

            document.getElementById("login-user").value = username;
        }

    </script>

</body>

</html>
