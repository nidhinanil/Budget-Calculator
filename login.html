<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Smart Wallet</title>
    <!-- Bootstrap  -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
        integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body class="bg-light text-dark font-monospace d-flex align-items-center min-vh-100 py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-8 col-lg-5">
                <!-- Brand Header -->
                <div class="text-center mb-4">
                    <div class="d-inline-flex align-items-baseline gap-2 mb-1">
                        <span class="fs-2 fw-bold font-monospace">Smart Wallet</span>
                        <span class="badge bg-light text-secondary border">v1</span>
                    </div>
                    <p class="text-secondary small mb-0">Smart Wallet Access</p>
                </div>

                <!-- Auth Card -->
                <div class="card bg-white border p-4 rounded-1 shadow-sm">
                    <!-- Nav Tabs -->
                    <ul class="nav nav-pills nav-fill mb-4 p-1 bg-light rounded" id="authTab" role="tablist">
                        <li class="nav-item" role="presentation">
                            <button class="nav-link active text-dark fw-bold btn-sm py-2" id="login-tab"
                                data-bs-toggle="tab" data-bs-target="#login-panel" type="button" role="tab">
                                <i class="fa-solid fa-arrow-right-to-bracket me-1"></i> Login
                            </button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button class="nav-link text-secondary fw-bold btn-sm py-2" id="register-tab"
                                data-bs-toggle="tab" data-bs-target="#register-panel" type="button" role="tab">
                                <i class="fa-solid fa-user-plus me-1"></i> Register
                            </button>
                        </li>
                    </ul>

                    <div class="tab-content">
                        <!-- Login Form -->
                        <div class="tab-pane fade show active" id="login-panel" role="tabpanel">
                            <form onsubmit="handleLogin(event)">
                                <div class="mb-3">
                                    <label class="small text-secondary mb-1">Username</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light text-secondary"><i
                                                class="fa-solid fa-user"></i></span>
                                        <input id="login-user" type="text" class="form-control font-monospace"
                                            placeholder="Enter username" required>
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <label class="small text-secondary mb-1">Password</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light text-secondary"><i
                                                class="fa-solid fa-lock"></i></span>
                                        <input id="login-pass" type="password" class="form-control font-monospace"
                                            placeholder="Enter password" required>
                                    </div>
                                </div>
                                <button type="submit" class="btn btn-dark w-100 py-2 mt-2">Sign In</button>
                            </form>
                        </div>

                        <!-- Register Form -->
                        <div class="tab-pane fade" id="register-panel" role="tabpanel">
                            <form id="reg-form" onsubmit="handleRegister(event)">
                                <div class="mb-3">
                                    <label class="small text-secondary mb-1">Username</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light text-secondary"><i
                                                class="fa-solid fa-user"></i></span>
                                        <input id="reg-user" type="text" class="form-control font-monospace"
                                            placeholder="Choose a username" required>
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <label class="small text-secondary mb-1">Email</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light text-secondary"><i
                                                class="fa-solid fa-envelope"></i></span>
                                        <input id="reg-email" type="email" class="form-control font-monospace"
                                            placeholder="name@domain.com" required>
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <label class="small text-secondary mb-1">Password</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light text-secondary"><i
                                                class="fa-solid fa-lock"></i></span>
                                        <input id="reg-pass" type="password" class="form-control font-monospace"
                                            placeholder="Create password" required>
                                    </div>
                                </div>
                                <button type="submit" class="btn btn-outline-dark w-100 py-2 mt-2">Create
                                    Account</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Redirect if already logged in
        const currentSession = localStorage.getItem("loggedkey");
        if (currentSession && localStorage.getItem(currentSession)) {
            window.location.href = "index.html";
        }

        function handleLogin(event) {
            event.preventDefault();
            const uname = document.getElementById("login-user").value.trim();
            const pass = document.getElementById("login-pass").value;

            const userData = localStorage.getItem(uname);
            if (!userData) {
                alert("User does not exist. Please register.");
                return;
            }

            const userObj = JSON.parse(userData);
            if (userObj.password !== pass) {
                alert("Incorrect password.");
                return;
            }

            localStorage.setItem("loggedkey", uname);
            window.location.href = "index.html";
        }

        function handleRegister(event) {
            event.preventDefault();
            const uname = document.getElementById("reg-user").value.trim();
            const email = document.getElementById("reg-email").value.trim();
            const pass = document.getElementById("reg-pass").value;

            if (localStorage.getItem(uname)) {
                alert("Username is already taken. Please choose another.");
                return;
            }

            const newUser = {
                uname: uname,
                email: email,
                password: pass,
                income: 0,
                expense: 0,
                incomeArray: [],
                expenseArray: []
            };

            localStorage.setItem(uname, JSON.stringify(newUser));
            alert("Account created successfully. Please sign in.");

            document.getElementById("reg-form").reset();
            const loginTabTrigger = document.getElementById("login-tab");
            const tab = bootstrap.Tab.getOrCreateInstance(loginTabTrigger);
            tab.show();
            document.getElementById("login-user").value = uname;
        }
    </script>
</body>

</html>
